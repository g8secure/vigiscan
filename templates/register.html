<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VigiScan Register</title>
<style>
body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#0f172a,#1e293b); color:white; display:flex; justify-content:center; align-items:center; height:100vh; }
form { background:#020617; padding:30px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.5); width:320px; text-align:center; }
input { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:none; }
button { width:100%; padding:10px; background:#38bdf8; color:white; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#0ea5e9; }
</style>
</head>
<body>
<form method="POST">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
        <svg width="50" height="50" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="rainbowGradReg" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#ff7f00;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#ffff00;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#00ff00;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#0000ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8b00ff;stop-opacity:1" />
                </linearGradient>
            </defs>
            <path d="M21 2L4 9v11c0 9.4 7.3 18.2 17 20 9.7-1.8 17-10.6 17-20V9L21 2z" fill="url(#rainbowGradReg)" />
            <ellipse cx="21" cy="21" rx="7" ry="4.5" stroke="white" stroke-width="2" fill="none" />
            <circle cx="21" cy="21" r="2.5" fill="white" />
        </svg>
        <h2 style="margin:0; font-size:1.8rem; background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: -0.02em;">
            VigiScan
        </h2>
    </div>
    <h2 style="margin-top: 0; font-size: 1rem; opacity: 0.7; font-weight: 400;">Create Account</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p style="color:#f87171;">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Register</button>
    <p>Already have an account? <a href="/login">Login</a></p>
</form>
</body>
</html>
