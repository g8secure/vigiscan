<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    border: 1px solid #334155;
    padding: 10px;
}

th { background: #1e293b; }

button {
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    margin-right: 5px;
}

.delete-btn {
    background: #e74c3c;
    color: white;
}

.make-btn {
    background: #3498db;
    color: white;
}

.remove-btn {
    background: #f39c12;
    color: white;
}
</style>
</head>

<body>

<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>🛡️ Admin Panel</h2>
    <a href="/dashboard" style="background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem;">🏠 Dashboard</a>
</div>
<p>Logged in as: {{ user }}</p>

<table>
<thead>
<tr>
<th>ID</th>
<th>Username</th>
<th>Role</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="userTable"></tbody>
</table>

<script>
function loadUsers(){
    fetch('/admin/users')
    .then(res => res.json())
    .then(data => {
        let html = "";

        data.forEach(u => {
            html += `
            <tr>
                <td>${u.id}</td>
                <td>${u.username}</td>
                <td>${u.role}</td>
                <td>
                    <button class="delete-btn" onclick="deleteUser(${u.id})">Delete</button>
                    <button class="make-btn" onclick="makeAdmin(${u.id})">Make Admin</button>
                    <button class="remove-btn" onclick="removeAdmin(${u.id})">Remove Admin</button>
                </td>
            </tr>`;
        });

        document.getElementById("userTable").innerHTML = html;
    });
}

function deleteUser(id){
    if(confirm("Are you sure you want to delete this user?")){
        fetch('/admin/delete_user/' + id, { method: 'DELETE' })
        .then(() => loadUsers());
    }
}

function makeAdmin(id){
    fetch('/admin/make_admin/' + id)
    .then(() => loadUsers());
}

function removeAdmin(id){
    fetch('/admin/remove_admin/' + id)
    .then(() => loadUsers());
}

loadUsers();
</script>

</body>
</html>
