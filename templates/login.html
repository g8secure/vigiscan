<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Vulnerability Scanner - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin: 0;
        }

        .login-container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 26px;
            color: #fff;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 6px;
            background-color: #ff9800;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #e68900;
        }

        .register-link {
            margin-top: 10px;
            display: block;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }

        .error {
            background-color: rgba(255,0,0,0.4);
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 2rem;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="VigiScan Logo" style="max-width: 320px; width: 100%; height: auto; transform: scale(1.15); filter: contrast(1.2) drop-shadow(0 4px 8px rgba(0,0,0,0.4));">
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="submit" value="Login">
        </form>
        <a href="{{ url_for('register') }}" class="register-link">👉 Don't have an account? Register</a>
    </div>
</body>
</html>
