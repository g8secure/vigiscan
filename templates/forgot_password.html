<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - VigiScan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin: 0;
        }
        .login-container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        h1 { margin-bottom: 20px; font-size: 22px; }
        p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 6px;
            background-color: #ff9800;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.3s;
        }
        input[type="submit"]:hover { background-color: #e68900; }
        .register-link {
            display: block;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            margin-top: 15px;
        }
        .error { background-color: rgba(255,0,0,0.4); padding: 8px; border-radius: 5px; margin-bottom: 10px; }
        .success { background-color: rgba(0,255,0,0.4); padding: 8px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Forgot Password</h1>
        <p>Enter your registered email address to receive a password reset link.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="post">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="submit" value="Send Reset Link">
        </form>
        <a href="{{ url_for('login') }}" class="register-link">⬅ Back to Login</a>
    </div>
</body>
</html>
